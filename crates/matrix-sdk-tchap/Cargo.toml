[package]
name = "matrix-sdk-tchap"
version = "0.1.0"
authors = ["Nicolas Buquet <nbuquet@buquet-net.com>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"

[features]
client = [] # needed for creating ruma like requests
server = [] # needed for creating ruma like requests
unstable-exhaustive-types = [] # needed for creating ruma like requests

[dependencies]
async-trait = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
ruma = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
url = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = "0.23.38"
rustls-pki-types = "1.14.0"
rustls-native-certs = "0.8.3"
webpki-roots = "1.0.6"


[build-dependencies]
uniffi = { workspace = true, features = [ "build" ] }

[lints]
workspace = true
